---
# =============================================================================
# defaults/main.yml — ansible-role-jupyterhub-env (Debian 13 / ansible-core 2.18)
#
# Single-node JupyterHub stack (LAB-only), as in setup-snj.sh:
#   Traefik (TLS ingress) + configurable-http-proxy (internal HTTP) +
#   JupyterHub (DockerSpawner) + inline monitoring (Prometheus/cAdvisor/
#   node-exporter/Grafana). Secrets via Docker Compose secrets.
# =============================================================================

# ---------- OS / Docker -------------------------------------------------------
# Install Docker CE from the official repo (codename trixie) within the role.
jupyterhub_install_docker: true
# Extra users to add to the 'docker' group (besides ansible_user).
jupyterhub_docker_users: []

# ---------- Filesystem layout (canonical path: infndatacloud) ----------------
# Compose project name, pinned so it does NOT depend on the basename of
# jupyterhub_base_dir: renaming the directory must not orphan the containers.
jupyterhub_compose_project: infndatacloud
jupyterhub_base_dir: /opt/infndatacloud
# jupyterhub_base_dir: /usr/local/share/infndatacloud/jupyterhub
jupyterhub_secrets_dir: "{{ jupyterhub_base_dir }}/secrets"
jupyterhub_certs_dir: "{{ jupyterhub_base_dir }}/certs"
jupyterhub_mounts_dir: /jupyter-mounts

# ---------- Execution ---------------------------------------------------------
jupyterhub_run: true

# ---------- Images ------------------------------------------------------------
jupyterhub_image_tag: 2.3.0
jupyterhub_harbor_prefix: harbor.cloud.infn.it/datacloud-jupyter
# Hub image 
jupyterhub_hub_image: "{{ jupyterhub_harbor_prefix }}/jhub-singlenode:{{ jupyterhub_image_tag }}"
# List of single-user images offered in the spawn form (CSV).
jupyterhub_images: "{{ jupyterhub_harbor_prefix }}/jlab-base:{{ jupyterhub_image_tag }}"
jupyterhub_http_proxy_image: jupyterhub/configurable-http-proxy:5.1.0
jupyterhub_traefik_image: traefik:v3.7.5

# ---------- Spawn -------------------------------------------------------------
jupyterhub_default_spawner: LAB
jupyterhub_ram_list: "1G,2G,4G,8G"
jupyterhub_cpu_list: "1,2,4,8"
jupyterhub_docker_network_name: jupyterhub
jupyterhub_post_start_cmd: ""

# ---------- GPU / CVMFS (placeholder: disabled, reserved for the future) ------
jupyterhub_use_gpu: false
jupyterhub_with_cvmfs: false
jupyterhub_cvmfs_repos: ""

# ---------- IAM / OAuth -------------------------------------------------------
jupyterhub_iam_url: "https://iam.cloud.infn.it/"
jupyterhub_iam_subject: ""
jupyterhub_iam_groups: ""
jupyterhub_iam_admin_groups: ""
# client_id + registration access token (to register the redirect_uris).
jupyterhub_iam_client_id: ""
jupyterhub_iam_token: ""
# Alternative to the registration token: client_secret of a pre-registered
# client (as IAM_CLIENT_SECRET in setup-snj.sh). If both are set, the value
# returned by IAM via the registration token wins.
jupyterhub_iam_client_secret: ""

# ---------- Network / TLS -----------------------------------------------------
jupyterhub_dns_name: ""
jupyterhub_contact_email: ""
# self-signed | letsencrypt-staging | letsencrypt-prod
jupyterhub_cert_manager_type: self-signed

# ---------- Public_IP / DNS_NAME  --------------------------
# Floating IPs are not visible on the VM interfaces, so if empty the public IP
# is discovered via api.ipify.org (set-facts.yml); DNS_NAME defaults to
# <public_ip>.<base_dns_name> when jupyterhub_dns_name is empty.
jupyterhub_public_ip: ""
jupyterhub_base_dns_name: "myip.cloud.infn.it"

# ---------- Monitoring (inline in the same compose) --------------------------
jupyterhub_monitoring: true
jupyterhub_grafana_admin_user: admin
# If empty, a random password is generated and stored in <secrets>/grafana_admin_password.
jupyterhub_grafana_admin_password: ""
jupyterhub_grafana_image: grafana/grafana:13.0.1
jupyterhub_prometheus_image: prom/prometheus:v3.11.2
jupyterhub_node_exporter_image: prom/node-exporter:v1.11.1
jupyterhub_cadvisor_image: gcr.io/cadvisor/cadvisor:v0.55.1
jupyterhub_prometheus_retention: 15d
