---
# =============================================================================
# tasks/install-docker.yml — Docker CE dal repo ufficiale (Debian trixie)
# Replica install_docker() di setup-snj.sh in modo idempotente.
# =============================================================================

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - openssl
      - rsync
      - fuse3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true
  register: _docker_repo

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ _docker_repo.changed }}"

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

# ansible_user_id is the become user (root); use the connection user instead.
- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ (jupyterhub_docker_users + [ansible_user | default('')]) | select | unique }}"
