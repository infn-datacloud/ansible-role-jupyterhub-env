---
# =============================================================================
# tasks/configure-compose.yml — copy static config, render .env, traefik and
# the final compose. Every change notifies a stack restart.
# =============================================================================

- name: Deploy Prometheus configuration
  ansible.builtin.copy:
    src: prometheus/prometheus.yml
    dest: "{{ jupyterhub_base_dir }}/prometheus/config/prometheus.yml"
    mode: "0644"
  notify: restart jupyterhub

- name: Deploy Grafana provisioning and dashboards
  ansible.builtin.copy:
    src: "grafana/{{ item }}"
    dest: "{{ jupyterhub_base_dir }}/grafana/{{ item }}"
    mode: "0644"
  loop:
    - provisioning/datasources/datasource.yaml
    - provisioning/dashboards/provider.yaml
    - dashboards/vm-overview.json
  notify: restart jupyterhub

- name: Deploy Traefik TLS file provider (self-signed only)
  ansible.builtin.copy:
    src: traefik/tls.yml
    dest: "{{ jupyterhub_base_dir }}/traefik/tls.yml"
    mode: "0644"
  when: _jupyterhub_selfsigned | bool
  notify: restart jupyterhub

# Secrets are read back from the files (not from facts set by other task
# files) so that partial runs, e.g. '--tags config', render a correct .env.
- name: Read back IAM client_secret (for Grafana OAuth)
  ansible.builtin.slurp:
    src: "{{ jupyterhub_secrets_dir }}/iam_client_secret"
  register: _iam_client_secret_slurp
  no_log: true

- name: Read back generated Grafana admin password
  ansible.builtin.slurp:
    src: "{{ jupyterhub_secrets_dir }}/grafana_admin_password"
  register: _gf_pw_slurp
  no_log: true
  when: jupyterhub_grafana_admin_password | length == 0

- name: Render environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ jupyterhub_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart jupyterhub

- name: Render docker compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ jupyterhub_base_dir }}/compose.yaml"
    mode: "0644"
    validate: "docker compose -f %s config -q"
  notify: restart jupyterhub
