---
# =============================================================================
# tasks/secrets.yml — secrets generated ONCE (idempotent via 'creates').
# Mounted into the containers as Docker Compose secrets (*_FILE).
# =============================================================================

- name: Generate random JupyterHub secrets (hex 32)
  ansible.builtin.shell:
    cmd: "umask 177 && openssl rand -hex 32 > '{{ jupyterhub_secrets_dir }}/{{ item }}'"
    creates: "{{ jupyterhub_secrets_dir }}/{{ item }}"
  loop: "{{ _jupyterhub_random_secrets }}"

# jupyter_proxy_token is read by configurable-http-proxy, which runs as
# nobody (65534): root/0600 would make it unreadable inside the container.
- name: Enforce secret file permissions
  ansible.builtin.file:
    path: "{{ jupyterhub_secrets_dir }}/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: jupyterhub_crypt_key, owner: root, mode: "0600" }
    - { name: jupyterhub_api_token, owner: root, mode: "0600" }
    - { name: jupyter_proxy_token, owner: "{{ _jupyterhub_nobody_uid }}", mode: "0400" }

# ---- IAM client_secret provided as a variable (no registration token) --------
# When jupyterhub_iam_token is set, iam-client.yml overwrites this file with
# the authoritative value returned by IAM.
- name: Write IAM client_secret from variable
  ansible.builtin.copy:
    content: "{{ jupyterhub_iam_client_secret }}"
    dest: "{{ jupyterhub_secrets_dir }}/iam_client_secret"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: jupyterhub_iam_client_secret | length > 0
  notify: restart jupyterhub

# ---- Grafana admin password (local fallback) --------------------------------
- name: Generate Grafana admin password (only if not provided)
  ansible.builtin.shell:
    cmd: "umask 177 && openssl rand -hex 24 > '{{ jupyterhub_secrets_dir }}/grafana_admin_password'"
    creates: "{{ jupyterhub_secrets_dir }}/grafana_admin_password"
  when: jupyterhub_grafana_admin_password | length == 0
