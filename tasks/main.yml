---
# =============================================================================
# tasks/main.yml — role entrypoint
# =============================================================================

- name: Assert supported OS (Debian 13 / trixie)
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] is version('13', '>=')
    fail_msg: >-
      This role only supports Debian 13 (trixie) or newer; detected
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    success_msg: "Supported OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."

- name: Set Facts
  ansible.builtin.include_tasks: set-facts.yml
  tags: [prepare]

- name: Install Docker CE (trixie)
  ansible.builtin.include_tasks: install-docker.yml
  when: jupyterhub_install_docker | bool
  tags: [docker]

- name: Prepare directory tree
  ansible.builtin.include_tasks: prepare-tree.yml
  tags: [prepare]

- name: Generate secrets
  ansible.builtin.include_tasks: secrets.yml
  tags: [secrets]

- name: Configure TLS certificates
  ansible.builtin.include_tasks: certificates.yml
  tags: [certs]

- name: Register/update IAM client
  ansible.builtin.include_tasks: iam-client.yml
  when:
    - jupyterhub_iam_client_id | length > 0
    - jupyterhub_iam_token | length > 0
  tags: [iam]

# With a pre-registered client (client_secret path) the registration endpoint
# is not usable (it requires the registration access token), so the role
# cannot add the redirect_uris itself: remind the operator to do it manually.
- name: Remind about manual redirect_uris registration (no registration token)
  ansible.builtin.debug:
    msg: >-
      jupyterhub_iam_token is empty: the role cannot update the IAM client.
      Make sure these redirect_uris are registered on client
      {{ jupyterhub_iam_client_id }}:
      {{ _jupyterhub_iam_redirect_uris | join(' , ') }}
  when:
    - jupyterhub_iam_client_id | length > 0
    - jupyterhub_iam_token | length == 0
  tags: [iam]

- name: Render configuration and compose
  ansible.builtin.include_tasks: configure-compose.yml
  tags: [config]

- name: Deploy the stack
  ansible.builtin.include_tasks: deploy.yml
  when: jupyterhub_run | bool
  tags: [deploy]
