---
# =============================================================================
# tasks/iam-client.yml — register the redirect_uris on the IAM client and store
# the client_secret as a Docker secret (iam_client_secret); configure-compose
# reads it back from the file for the Grafana .env.
# =============================================================================

- name: Retrieve IAM OpenID configuration
  ansible.builtin.uri:
    url: "{{ jupyterhub_iam_url | regex_replace('/$', '') }}/.well-known/openid-configuration"
    method: GET
    return_content: true
  register: _openid_config

- name: Retrieve current IAM client info
  ansible.builtin.uri:
    url: "{{ _openid_config.json.registration_endpoint }}/{{ jupyterhub_iam_client_id }}"
    method: GET
    status_code: 200
    headers:
      Accept: application/json
      Authorization: "Bearer {{ jupyterhub_iam_token }}"
    return_content: true
  register: _iam_client_get
  no_log: true

- name: Build updated client payload with redirect_uris
  ansible.builtin.set_fact:
    _iam_client_payload: >-
      {{ _iam_client_get.json | combine({'redirect_uris': _jupyterhub_iam_redirect_uris}) }}
  no_log: true

- name: Update IAM client (only when the redirect_uris differ)
  ansible.builtin.uri:
    url: "{{ _openid_config.json.registration_endpoint }}/{{ jupyterhub_iam_client_id }}"
    method: PUT
    status_code: 200
    headers:
      Authorization: "Bearer {{ jupyterhub_iam_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ _iam_client_payload }}"
    return_content: true
  register: _iam_update
  no_log: true
  when: >-
    (_iam_client_get.json.redirect_uris | default([]) | sort)
    != (_jupyterhub_iam_redirect_uris | sort)

- name: Select the authoritative client representation
  ansible.builtin.set_fact:
    _iam_client_info: "{{ _iam_update.json | default(_iam_client_get.json) }}"
  no_log: true

- name: Persist IAM client_secret as Docker secret
  ansible.builtin.copy:
    content: "{{ _iam_client_info.client_secret }}"
    dest: "{{ jupyterhub_secrets_dir }}/iam_client_secret"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart jupyterhub

- name: Save IAM client info locally
  ansible.builtin.copy:
    content: "{{ _iam_client_info | to_nice_json }}"
    dest: "{{ jupyterhub_base_dir }}/cookies/.client-iam.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true
