---
# =============================================================================
# vars/main.yml — internal role constants (not meant to be overridden).
# =============================================================================

# TLS variant derived from jupyterhub_cert_manager_type.
_jupyterhub_selfsigned: "{{ jupyterhub_cert_manager_type == 'self-signed' }}"
_jupyterhub_le_staging: "{{ jupyterhub_cert_manager_type == 'letsencrypt-staging' }}"

# Secrets generated on-host (openssl rand -hex 32) and mounted as Docker secrets.
_jupyterhub_random_secrets:
  - jupyterhub_crypt_key
  - jupyterhub_api_token
  - jupyter_proxy_token

# Service UID/GID for bind-mounts (aligned with the upstream images).
_jupyterhub_grafana_uid: 472
_jupyterhub_nobody_uid: 65534

# redirect_uris to register on the IAM client. Hub always on 443; Grafana always
# under the /grafana sub-path behind Traefik (self-signed too), so a single URL.
_jupyterhub_iam_redirect_uris: >-
  {{
    ['https://' ~ jupyterhub_dns_name ~ '/hub/oauth_callback']
    + (['https://' ~ jupyterhub_dns_name ~ '/grafana/login/generic_oauth']
       if jupyterhub_monitoring | bool else [])
  }}
